[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "furnibox-odoo-tools"
version = "0.1.0"
description = "Read-only Odoo reports and validation tools for Furnibox"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
furnibox-stock-by-location = "run_stock_by_location:main"

[tool.setuptools]
py-modules = ["run_stock_by_location"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "reports*", "validators*"]